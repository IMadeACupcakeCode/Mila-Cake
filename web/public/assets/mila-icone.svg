           C344 202 324 214 304 190 C288 210 272 204 256 220
           C240 204 224 210 208 190 C188 214 168 202 146 224 Z" fill="url(#hair)"/>
  <path d="M160 214 C168 156 204 126 246 118" fill="none" stroke="#5a4775" stroke-width="9" stroke-linecap="round" opacity="0.5"/>

