<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Ícone da Mila">
  <defs>
    <linearGradient id="aero" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#eaf7ff"/>
      <stop offset="0.22" stop-color="#8fcdf5"/>
      <stop offset="0.62" stop-color="#2e75b6"/>
      <stop offset="1" stop-color="#0b3f74"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3b2d4f"/>
      <stop offset="0.55" stop-color="#241a33"/>
      <stop offset="1" stop-color="#140e1f"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7f5"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ff7b8a"/>
      <stop offset="0.5" stop-color="#e0263e"/>
      <stop offset="1" stop-color="#7c0d1e"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5b6e"/>
      <stop offset="1" stop-color="#b1122a"/>
    </linearGradient>
  </defs>

  <!-- janela Aero -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#aero)" stroke="#d6f0ff" stroke-width="4"/>
  <rect x="22" y="22" width="468" height="214" rx="82" fill="url(#gloss)"/>
  <circle cx="392" cy="108" r="150" fill="#ffffff" opacity="0.10"/>
  <circle cx="120" cy="420" r="120" fill="#0a2f57" opacity="0.18"/>

  <!-- cabelo de trás -->
  <path d="M118 320 C92 158 168 86 256 86 C344 86 420 158 394 320 C388 372 366 398 340 408 L172 408 C146 398 124 372 118 320 Z" fill="url(#hair)"/>
  <path d="M126 300 C120 210 158 146 206 120" fill="none" stroke="#5a4775" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

  <!-- pescoço e ombros -->
  <path d="M232 372 h48 v40 h-48 z" fill="#f2c9bd"/>
  <path d="M146 488 C158 416 204 386 256 386 C308 386 354 416 366 488 Z" fill="url(#dress)" stroke="#b9cee2" stroke-width="3"/>
  <path d="M206 396 C226 420 286 420 306 396 L296 386 L216 386 Z" fill="#eef4fb"/>

  <!-- laço vermelho -->
  <path d="M256 402 L212 380 L216 420 Z" fill="url(#ribbon)"/>
  <path d="M256 402 L300 380 L296 420 Z" fill="url(#ribbon)"/>
  <circle cx="256" cy="402" r="11" fill="#d81e37" stroke="#8d0c1e" stroke-width="2"/>

  <!-- orelhas -->
  <ellipse cx="150" cy="272" rx="18" ry="28" fill="#ffdfd3"/>
  <ellipse cx="362" cy="272" rx="18" ry="28" fill="#ffdfd3"/>

