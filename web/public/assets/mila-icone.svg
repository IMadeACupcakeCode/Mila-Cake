  <path d="M282 234 C296 226 316 226 330 236" fill="none" stroke="#3a2440" stroke-width="7" stroke-linecap="round"/>

  <!-- olhos -->
  <ellipse cx="210" cy="276" rx="30" ry="36" fill="#ffffff" stroke="#3a2440" stroke-width="5"/>
  <ellipse cx="302" cy="276" rx="30" ry="36" fill="#ffffff" stroke="#3a2440" stroke-width="5"/>
  <ellipse cx="212" cy="280" rx="20" ry="27" fill="url(#iris)"/>
  <ellipse cx="304" cy="280" rx="20" ry="27" fill="url(#iris)"/>
  <ellipse cx="212" cy="284" rx="9" ry="14" fill="#2b0710"/>
  <ellipse cx="304" cy="284" rx="9" ry="14" fill="#2b0710"/>
  <circle cx="204" cy="266" r="8" fill="#ffffff"/>
  <circle cx="296" cy="266" r="8" fill="#ffffff"/>
  <circle cx="220" cy="294" r="4" fill="#ffd9de" opacity="0.9"/>
  <circle cx="312" cy="294" r="4" fill="#ffd9de" opacity="0.9"/>

  <!-- bochechas e boca -->
  <ellipse cx="172" cy="318" rx="20" ry="11" fill="#ff9db0" opacity="0.45"/>
  <ellipse cx="340" cy="318" rx="20" ry="11" fill="#ff9db0" opacity="0.45"/>
  <path d="M244 334 C250 344 262 344 268 334" fill="none" stroke="#a64a5c" stroke-width="5" stroke-linecap="round"/>

  <!-- selo cupcake -->
  <circle cx="430" cy="430" r="62" fill="#ffffff" stroke="#8fcdf5" stroke-width="5"/>
  <circle cx="430" cy="430" r="52" fill="#fdf3ea"/>
  <path d="M402 430 h56 l-6 30 a8 8 0 0 1 -8 7 h-28 a8 8 0 0 1 -8 -7 Z" fill="#e8a15c" stroke="#b9722f" stroke-width="3"/>
  <path d="M400 428 C404 402 456 402 460 428 Z" fill="#ffd1e0" stroke="#ffffff" stroke-width="3"/>
  <circle cx="430" cy="400" r="9" fill="#e0263e"/>
  <path d="M430 392 C432 382 438 378 444 376" fill="none" stroke="#3f8f3f" stroke-width="4" stroke-linecap="round"/>

  <!-- brilhos -->
  <path d="M92 120 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M420 150 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 Z" fill="#ffffff" opacity="0.75"/>
